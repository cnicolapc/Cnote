name: Build Cnote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: Cnote

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Rendi eseguibile gradlew
        run: chmod +x ./gradlew || true

      - name: Genera gradle wrapper se mancante
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      - name: Compila APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Carica APK come risultato scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Cnote-debug-apk
          path: Cnote/app/build/outputs/apk/debug/*.apk
